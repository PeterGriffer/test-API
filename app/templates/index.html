<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Коллекция фильмов</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Коллекция фильмов</h1>

  <div class="row">
    <!-- Список фильмов -->
    <div class="col-md-5">
      <h2>Фильмы</h2>
      <ul class="list-group" id="movie-list"></ul>
      <button class="btn btn-warning mt-3" onclick="createNewMovie()">Новый фильм</button>
      <button class="btn btn-danger mt-3" onclick="deleteAllMovies()">Удалить все</button>
    </div>

    <!-- Форма деталей -->
    <div class="col-md-5 offset-md-2">
      <div id="movie-details" style="display:none;">
        <h3 id="details-title"></h3>
        <form>
          <div class="mb-2">
            <label>Название</label>
            <input class="form-control" id="title">
          </div>
          <div class="mb-2">
            <label>Режиссёр</label>
            <input class="form-control" id="director">
          </div>
          <div class="mb-2">
            <label>Год</label>
            <input class="form-control" id="year" type="number">
          </div>
          <div class="mb-2">
            <label>Жанр</label>
            <input class="form-control" id="genre">
          </div>
          <div class="mb-2">
            <label>Рейтинг</label>
            <input class="form-control" id="rating" type="number" step="0.1">
          </div>
          <div class="mb-2">
            <label>Описание</label>
            <textarea class="form-control" id="description"></textarea>
          </div>
          <button type="button" class="btn btn-primary" id="btn-create" onclick="submitCreate()">Создать</button>
          <button type="button" class="btn btn-info" id="btn-update" onclick="submitUpdate()">Обновить</button>
          <button type="button" class="btn btn-danger" id="btn-delete" onclick="submitDelete()">Удалить</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
